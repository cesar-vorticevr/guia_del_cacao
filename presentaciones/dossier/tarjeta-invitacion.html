<title>Invitación Guía del Cacao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
{{css}}

/* Una sola imagen 4:5 (1080 × 1350) para mandar por WhatsApp o subir a redes. */
body { margin: 0; background: var(--selva-2); }
.tarjeta-inv {
  width: 540px; height: 675px; position: relative; overflow: hidden;
  background: var(--selva-2); color: var(--crema);
  padding: 34px 32px; display: grid; grid-template-rows: auto 1fr auto; gap: 14px;
}
.tarjeta-inv .logo { width: 150px; filter: drop-shadow(0 5px 0 rgb(0 0 0 / .2)); position: relative; z-index: 1; }
.tarjeta-inv .centro { display: grid; align-content: center; gap: 14px; position: relative; z-index: 1; }
.tarjeta-inv .ceja { margin: 0; }
.tarjeta-inv h1 { font-size: 46px; color: var(--crema); max-width: 9.5ch; }
.tarjeta-inv h1 em { font-style: normal; color: var(--mango); }
.tarjeta-inv p { font-size: 18px; max-width: 26ch; color: rgb(255 247 232 / .88); }
.tarjeta-inv .sello { justify-self: start; background: var(--mango); color: var(--ink); border-radius: 18px; padding: 10px 16px; font-family: var(--display); font-weight: 700; font-size: 24px; box-shadow: 0 5px 0 0 rgb(0 0 0 / .2); transform: rotate(-2deg); }
.tarjeta-inv .pie { display: flex; justify-content: space-between; align-items: end; gap: 10px; position: relative; z-index: 1; font-family: var(--mono); font-size: 14px; }
.tarjeta-inv .pie b { font-family: var(--display); font-size: 22px; color: var(--crema); display: block; }
</style>

<div class="tarjeta-inv">
  <img class="deco" src="{{img:rama3}}" alt="" style="right:0; top:-20px; width:260px; transform:scaleX(-1)">
  <img class="deco" src="{{img:granos}}" alt="" style="right:26px; bottom:70px; width:80px">
  <img class="logo" src="{{img:logo}}" alt="Guía del Cacao">
  <div class="centro">
    <p class="ceja">Te invito</p>
    <h1>Tu negocio en la <em>Guía del Cacao</em></h1>
    <p>Tu propia página con fotos, catálogo, ubicación y WhatsApp. Que te encuentren en todo México.</p>
    <span class="sello">15 días gratis</span>
  </div>
  <div class="pie">
    <span><b>guiadelcacao.com</b>{{corto}} te ayuda a darlo de alta</span>
    <span style="white-space:nowrap">{{telefono}}</span>
  </div>
</div>
