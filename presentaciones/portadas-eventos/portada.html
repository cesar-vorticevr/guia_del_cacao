<!doctype html>
<!-- Portada 4:3 de un evento de la agenda, con la noche y el oro del sitio.
     La pinta construir.mjs con ?datos=<json>; sin parámetro enseña un ejemplo. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada de evento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Mono:wght@700&display=block">
<style>
:root { --crema: #fff7e8; --mango: #ffb703; --ink: #22150e; --acento: #ffb703; color-scheme: dark; }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 900px; overflow: hidden; background: #08150f; font-family: "Plus Jakarta Sans", sans-serif; color: var(--crema); }
.lienzo {
  position: relative; width: 1200px; height: 900px; overflow: hidden; padding: 72px 80px 64px;
  display: flex; flex-direction: column;
  background: linear-gradient(160deg, #1b1036 0%, #102a24 60%, #08150f 100%);
}
.lienzo::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 88% 18%, color-mix(in srgb, var(--acento) 42%, transparent), transparent 42%),
    radial-gradient(circle at 10% 92%, rgb(18 184 172 / 0.18), transparent 40%),
    radial-gradient(circle at 30% 10%, rgb(255 93 115 / 0.14), transparent 35%);
}
.cielo { position: absolute; inset: 0; }
.estrella { position: absolute; border-radius: 50%; background: var(--crema); }
.luz { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgb(255 225 120 / 0.9), transparent 70%); }
/* El anillo de oro: la firma gráfica de las portadas */
.anillo {
  position: absolute; right: -170px; top: -170px; width: 640px; height: 640px; border-radius: 50%;
  border: 3px solid color-mix(in srgb, var(--acento) 65%, transparent);
  box-shadow: 0 0 80px color-mix(in srgb, var(--acento) 30%, transparent), inset 0 0 80px color-mix(in srgb, var(--acento) 18%, transparent);
}
.anillo.dos { right: -90px; top: -90px; width: 480px; height: 480px; border-width: 2px; opacity: .55; }
.lienzo > :not(.cielo, .anillo) { position: relative; }

.arriba { display: flex; align-items: center; justify-content: space-between; }
.firma { height: 54px; }
.etiqueta {
  font-family: "Space Mono", monospace; font-weight: 700; font-size: 20px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink); background: var(--acento); padding: 10px 22px; border-radius: 999px;
}
.fecha { margin-top: auto; display: flex; align-items: baseline; gap: 22px; }
.fecha .dia { font-family: "Fraunces", serif; font-weight: 700; font-size: 150px; line-height: .8; color: var(--acento); font-variant-numeric: lining-nums; }
.fecha .resto { font-family: "Space Mono", monospace; font-weight: 700; font-size: 28px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.35; }
h1 {
  margin-top: 34px; font-family: "Fraunces", serif; font-weight: 600; font-variation-settings: "opsz" 144;
  font-size: 76px; line-height: 1.02; letter-spacing: -.015em; text-wrap: balance; max-width: 1000px;
}
h1 em { font-style: italic; color: var(--acento); }
.lugar { margin-top: 26px; display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 500; color: rgb(255 247 232 / .82); }
.lugar::before { content: ""; width: 44px; height: 3px; background: var(--acento); }
</style>
</head>
<body>
<main class="lienzo">
  <div class="cielo"></div>
  <div class="anillo"></div>
  <div class="anillo dos"></div>
  <div class="arriba">
    <img class="firma" src="firma.png" alt="Guía del Cacao">
    <span class="etiqueta" id="etiqueta"></span>
  </div>
  <p class="fecha"><span class="dia" id="dia"></span><span class="resto" id="resto"></span></p>
  <h1 id="titulo"></h1>
  <p class="lugar" id="lugar"></p>
</main>
<script>
const datos = JSON.parse(new URLSearchParams(location.search).get("datos") || JSON.stringify({
  etiqueta: "Concierto gratuito", dia: "15", resto: "Domingo<br>Noviembre · 21:00",
  titulo: "Aleks Syntek <em>en concierto</em>", lugar: "Teatro al Aire Libre, Parque Tabasco", acento: "#ff5d73",
}));
document.documentElement.style.setProperty("--acento", datos.acento);
for (const campo of ["etiqueta", "dia", "resto", "titulo", "lugar"]) document.getElementById(campo).innerHTML = datos[campo];

// Estrellas con semilla: cada portada distinta, y la misma en cada exportación.
let semilla = [...datos.titulo].reduce((s, c) => (s * 31 + c.charCodeAt(0)) % 2147483647, 7) || 7;
const azar = () => ((semilla = (semilla * 16807) % 2147483647) - 1) / 2147483646;
const cielo = document.querySelector(".cielo");
for (let i = 0; i < 70; i++) {
  const e = document.createElement("span");
  e.className = "estrella";
  const t = 1.5 + azar() * 2.5;
  Object.assign(e.style, { left: azar() * 100 + "%", top: azar() * 100 + "%", width: t + "px", height: t + "px", opacity: .2 + azar() * .6 });
  cielo.append(e);
}
for (let i = 0; i < 7; i++) {
  const l = document.createElement("span");
  l.className = "luz";
  const t = 18 + azar() * 26;
  Object.assign(l.style, { left: azar() * 100 + "%", top: azar() * 100 + "%", width: t + "px", height: t + "px", opacity: .35 + azar() * .4 });
  cielo.append(l);
}
</script>
</body>
</html>
